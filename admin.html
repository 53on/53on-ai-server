<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>53ON AI Server</title>
<link rel="icon" href="/admin/logo.png">
<style>
  /* tokens: Strata's (github.com/Niko1221/Strata, MIT; Copyright (c) 2026 Niko1221 and the Strata contributors;
     app/host/src/styles/kit/tokens.css) under this panel's own names; new ones: --lns line-soft, --tx2 ink-soft, --ach accent hover,
     --aci ink on accent, --act accent as text, --att accent tint, --dzt/--dzx danger tint/text, --wn warn, --fo focus, --shc/--shp card/pop shadows */
  :root{--bg:#0e1113;--card:#161a1d;--ln:#2a3036;--lns:#22272c;--tx:#eef1f3;--tx2:#c7cdd3;--mut:#8e979f;--ac:#34d399;--ach:#4ade80;--aci:#052e20;--act:#4ade80;--att:rgba(52,211,153,.12);--ok:#34d399;--dz:#ff5a6e;--dzt:rgba(255,90,110,.12);--dzx:#ff8a98;--wn:#f5b53d;--in:#1d2226;--fo:#7b93ff;--shc:0 1px 2px rgba(0,0,0,.4);--shp:0 16px 48px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4)}
  :root[data-theme=light]{--bg:#f9fafb;--card:#fff;--ln:#dee5ee;--lns:#eee;--tx:#221e1f;--tx2:#303030;--mut:#6f6f6f;--ac:#10b981;--ach:#0c8a60;--aci:#fff;--act:#0c8a60;--att:#ecfdf5;--ok:#0c8a60;--dz:#e0283f;--dzt:#fdecee;--dzx:#b01a2e;--wn:#e39b0b;--in:#f7f7f7;--fo:#405de6;--shc:0 18px 7px rgba(0,0,0,.01),0 10px 6px rgba(0,0,0,.02),0 4px 4px rgba(0,0,0,.03),0 1px 2px rgba(0,0,0,.04);--shp:0 10px 40px rgba(15,23,42,.08),0 1px 3px rgba(15,23,42,.06)}
  @media (prefers-color-scheme:light){:root:not([data-theme]){--bg:#f9fafb;--card:#fff;--ln:#dee5ee;--lns:#eee;--tx:#221e1f;--tx2:#303030;--mut:#6f6f6f;--ac:#10b981;--ach:#0c8a60;--aci:#fff;--act:#0c8a60;--att:#ecfdf5;--ok:#0c8a60;--dz:#e0283f;--dzt:#fdecee;--dzx:#b01a2e;--wn:#e39b0b;--in:#f7f7f7;--fo:#405de6;--shc:0 18px 7px rgba(0,0,0,.01),0 10px 6px rgba(0,0,0,.02),0 4px 4px rgba(0,0,0,.03),0 1px 2px rgba(0,0,0,.04);--shp:0 10px 40px rgba(15,23,42,.08),0 1px 3px rgba(15,23,42,.06)}}
  *{box-sizing:border-box} body{margin:0;font:14px/1.5 Inter,system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx)}
  .wrap{max-width:780px;margin:0 auto;padding:22px 16px 60px}
  h1{font-size:20px;margin:0 0 2px} .sub{color:var(--mut);font-size:12px}
  .hd{display:flex;gap:10px;align-items:flex-start;margin-bottom:18px} .hd>div{flex:1} #thbtn{padding:6px 10px}
  .card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;margin-bottom:14px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:0 0 12px}
  label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
  input,select{width:100%;background:var(--in);border:1px solid var(--ln);color:var(--tx);border-radius:9px;padding:9px 11px;font-size:14px}
  button{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer}
  button.ghost{background:var(--in);border:1px solid var(--ln);color:var(--tx)}
  button.dz{background:transparent;color:var(--dz);border:1px solid var(--dz);padding:5px 9px}
  button.play{background:var(--ok);color:#fff}
  button.danger{background:var(--dz);color:#fff}
  button.tg{flex:0 0 auto;min-width:48px;font-size:15px}
  button:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap} .row>div{flex:1;min-width:130px}
  table{width:100%;border-collapse:collapse;margin-top:8px} td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln);font-size:13px;vertical-align:middle}
  th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase}
  code{background:var(--in);border:1px solid var(--ln);border-radius:6px;padding:2px 6px;font-size:12px;word-break:break-all}
  .pill{display:inline-block;background:var(--in);border:1px solid var(--ln);border-radius:20px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0}
  .ok{color:var(--ok)} .mut{color:var(--mut)} .hide{display:none} .sp{margin-top:12px}
  .vbar{background:var(--in);border:1px solid var(--ln);border-radius:7px;height:9px;margin:7px 0;overflow:hidden}
  .vbar>i{display:block;height:100%;background:var(--ok)}
  .vbar.warn>i{background:var(--ac)} .vbar.full>i{background:var(--dz)}
  .mdl{display:flex;align-items:center;gap:9px;margin:4px 0} .mdl>span{flex:1;min-width:0}
  .ask{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:99}
  .ask[hidden]{display:none}
  .askb{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:18px;max-width:330px}
  .askr{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#05231a;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.25s}
  .toast.show{opacity:1}
  .ch{display:flex;align-items:center;gap:8px;margin-bottom:10px} .ch h2{margin:0;flex:1}
  /* dock: monitor and log outside the tabs */
  #logs{display:flex;flex-direction:column;padding-left:12px;padding-right:12px} .lg{flex:1 0 130px;overflow:auto} #pulse,#pulseTop{font-size:12px} #pulse td,#pulse th{padding:5px 3px;white-space:nowrap}
  #pulse thead th{position:sticky;top:0;background:var(--card)} #pulse td:last-child{max-width:200px;overflow:hidden;text-overflow:ellipsis}
  .n{text-align:right} .bad{color:var(--dz)} .amb{color:#f59e0b}
  /* header in column 1: the dock starts at the top */
  @media(min-width:1024px){.wrap{max-width:1280px;padding-bottom:14px} #gate{max-width:748px;margin:auto}
    .wrap:has(#app:not(.hide)){display:grid;grid-template-columns:minmax(0,1fr) clamp(360px,31vw,400px);grid-template-rows:auto 1fr;column-gap:14px;align-items:start} #app:not(.hide){display:contents}
    #dock{grid-area:1/2/3;position:sticky;top:14px;height:calc(100vh - 28px);overflow:auto;display:flex;flex-direction:column}
    #logs{flex:1 0 auto;margin:0}}
  .mn-vit{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
  .mn-c{border:1px solid var(--ln);border-radius:12px;padding:6px 10px;min-width:0;line-height:1.35} .mn-c.off{display:none}
  .mn-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mut);white-space:nowrap}
  .mn-d{flex:none;width:9px;height:9px;border-radius:50%;background:var(--ln)}
  .mn-d.g{background:#22c55e;box-shadow:0 0 6px #22c55e} .mn-d.y{background:#f59e0b;box-shadow:0 0 6px #f59e0b} .mn-d.r{background:#ef4444;box-shadow:0 0 6px #ef4444}
  .mn-d.y,.mn-d.r{animation:mnb 1s infinite} @keyframes mnb{50%{opacity:.3}}
  .mn-v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
  .mn-s{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
  #mn_cv{display:block;width:100%;height:160px;border:1px solid var(--ln);border-radius:12px;background:var(--in)}
  .mn-kv>div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:13px}
  .mn-kv .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  /* ── super-pro polish: feedback, elevation, focus, loading (UI only) ── */
  button,input,select,.vtab,.pill,tbody tr{transition:background .15s,border-color .15s,box-shadow .15s,transform .08s,filter .15s}
  button:hover:not(:disabled){filter:brightness(1.08)} button:active:not(:disabled){transform:translateY(1px)}
  .ghost:hover:not(:disabled),.dz:hover:not(:disabled){background:var(--ln)}
  :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
  input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
  .card{box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06)}
  :root:not([data-theme=light]) .card{box-shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.3)}
  tbody tr:hover td{background:var(--in)}
  .vtab:hover{background:var(--in)} .vtab[aria-selected=true]{background:var(--in);color:var(--ac);font-weight:600}
  .pill:hover{border-color:var(--ac)}
  #gate{max-width:400px;margin-left:auto;margin-right:auto}
  .sk{position:relative;overflow:hidden;background:var(--in);border-radius:8px;min-height:1em;color:transparent!important}
  .sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--tx) 8%,transparent),transparent);transform:translateX(-100%);animation:sh 1.3s infinite}
  @keyframes sh{100%{transform:translateX(100%)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hd"><img src="/admin/logo.png" alt="53ON" width="40" height="40"><div><h1>53ON AI Server <span class="mut" style="font-weight:400" data-t="panel"></span></h1>
  <div class="sub" data-t="subtitle"></div></div>
  </header>

  <div id="gate" class="card">
    <h2 data-t="access"></h2>
    <label data-t="admin_token"></label>
    <div class="row"><div><input id="tok" type="password" placeholder="admin_token"></div><div style="flex:0"><button onclick="enter()" data-t="log_in"></button></div></div>
    <div id="gerr" class="mut sp"></div>
  </div>

  <div id="app" class="hide">
    <aside id="dock">
      <div id="mon" class="card">
        <div class="ch"><button id="mn_fold" class="tg ghost" onclick="monFold()" data-tt="mon_fold" style="min-width:30px;padding:4px 8px">▾</button><h2 data-t="monitor"></h2><span id="mn_st" class="pill"></span><button class="tg" data-tt="mon_wipe" onclick="monWipe()">🗑</button><button id="mn_tg" class="tg danger" onclick="monToggle()">⏸</button></div>
        <canvas id="mn_cv"></canvas><div id="mn_vit" class="mn-vit sp"></div><div id="mn_ia" class="sp"></div>
      </div>
      <div id="logs" class="card">
        <div class="ch"><h2 data-t="activity"></h2><button class="tg" data-tt="report_tip" onclick="copyReport()">📋 <span data-t="report"></span></button></div>
        <div id="pulseTop" class="mut">—</div>
        <div class="lg"><table id="pulse"><thead><tr><th data-t="time"></th><th data-t="status"></th><th class="n" data-tt="in_tip" data-t="prompt"></th><th class="n" data-tt="cache_tip" data-t="reused"></th><th class="n" data-tt="out_tip" data-t="output"></th><th class="n" data-tt="tps_tip">Tok/s</th><th class="n" data-t="duration"></th></tr></thead><tbody></tbody></table></div>
      </div>
    </aside>
    <div class="tabwrap">
      <nav class="vtabs" role="tablist" aria-orientation="vertical">
        <button class="vtab" role="tab" data-tab="status" data-tt="status" aria-selected="true"><span class="ti">📊</span><span class="tl" data-t="status"></span></button>
        <button class="vtab" role="tab" data-tab="models" data-tt="models" aria-selected="false"><span class="ti">🧠</span><span class="tl" data-t="models"></span></button>
        <button class="vtab" role="tab" data-tab="cloud" data-tt="cloud" aria-selected="false"><span class="ti">☁️</span><span class="tl" data-t="cloud"></span></button>
        <button class="vtab" role="tab" data-tab="keys" data-tt="keys" aria-selected="false"><span class="ti">🔑</span><span class="tl" data-t="keys"></span></button>
        <button class="vtab" role="tab" data-tab="options" data-tt="settings" aria-selected="false"><span class="ti">⚙️</span><span class="tl" data-t="settings"></span></button>
        <button class="vtab" role="tab" data-tab="about" data-tt="about" aria-selected="false"><span class="ti">ℹ️</span><span class="tl" data-t="about"></span></button>
      </nav>
      <div class="vpanes">
    <div class="card" data-pane="status" role="tabpanel">
      <h2 data-t="status"></h2>
      <div id="state"></div>
      <div id="mn_vx" class="mn-vit sp"></div><div id="mn_kv" class="mn-kv sp"></div>
    </div>

    <div class="card" data-pane="models" role="tabpanel" hidden>
      <h2 data-t="models"></h2>
      <div id="mperf"></div>
      <div class="msec">⚙️ <span data-t="image_gen"></span></div>
      <div id="drawer" class="sp"></div>
      <div id="models" class="sp"></div>
      <div id="med" class="med sp" hidden></div>
      <div id="today" class="sp"></div>
      <details id="uh" class="uhist" hidden><summary></summary><div class="mn-kv"></div></details>
      <details class="sp" ontoggle="this.open&&tplLoad()"><summary>🧩 <span data-t="layer"></span></summary><textarea id="tpl_sys" rows="3" style="width:100%;margin-top:8px;font:12px/1.4 monospace" data-tp="layer_ph"></textarea><button class="tg" onclick="tplSave()" data-t="save"></button><pre id="tpl" class="mut" style="white-space:pre-wrap;font-size:12px;max-height:50vh;overflow:auto;margin:8px 0 0"></pre></details>
    </div>

    <div class="card" data-pane="cloud" role="tabpanel" hidden>
      <h2 data-t="cloud"></h2>
      <div class="mut" data-t="cloud_note"></div>
      <div id="cloudp" class="sp"></div>
      <details class="sp" ontoggle="this.open&&ccLoad()"><summary>📚 <span data-t="cc_title"></span></summary><div id="ccb"></div></details>
    </div>

    <div class="card" data-pane="options" role="tabpanel" hidden>
      <h2 data-t="connection"></h2>
      <label data-t="home_net"></label>
      <div id="lan" class="mut"></div>
      <label class="sp" data-t="internet"></label>
      <div id="pub" class="mut"></div>
      <div class="sp"><button class="ghost" style="flex:0" onclick="testConn()" data-t="test_conn"></button> <span id="testout" class="mut" style="margin-left:8px"></span></div>
    </div>

    <div class="card" data-pane="about" role="tabpanel" hidden>
      <h2 data-t="about"></h2>
      <div id="about"></div>
    </div>

    <div class="card" data-pane="keys" role="tabpanel" hidden>
      <h2 data-t="api_keys"></h2>
      <div class="row" style="align-items:flex-start">
        <div><label data-t="name"></label><input id="kname" data-tp="name_ph"></div>
        <div style="position:relative"><label data-t="tokens"></label>
          <div style="display:flex;gap:4px">
            <input id="kquota" type="text" value="1.00M" data-tp="quota_ph" style="flex:1;min-width:0">
            <button type="button" class="ghost" onclick="togglePresets()" data-tt="plans" style="flex:0 0 auto;padding:0 11px">▾</button>
          </div>
          <div id="chipsT" hidden style="position:absolute;left:0;right:0;top:100%;z-index:25;background:#fff;border:1px solid #dfe3ec;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:4px;margin-top:3px"></div>
        </div>
        <div><label data-t="months"></label><input id="kmonths" type="number" min="0" step="1" value="1"></div>
        <div><label data-t="day_tokens"></label><input id="kday" type="text" value="0" data-tp="day_ph" data-tt="day_tip"></div>
        <div><label data-t="images"></label><select id="kimg"></select></div>

        <div style="flex:0"><button onclick="addKey()" data-t="key_create"></button></div>
      </div>
      <div class="mut" style="margin-top:6px" data-t="keys_note"></div>
      <table id="keys"><thead><tr><th data-t="name"></th><th data-t="key"></th><th data-t="usage_quota"></th><th></th></tr></thead><tbody></tbody></table>
      <div id="krot" class="sp"></div>
    </div>
    <div class="card" data-pane="options" role="tabpanel" hidden>
      <h2 data-t="appearance"></h2>
      <label data-t="theme"></label>
      <div id="themeSeg" class="row" style="gap:6px">
        <button class="tg" data-th="" onclick="setTheme('')">🌓 <span data-t="th_system"></span></button>
        <button class="tg" data-th="light" onclick="setTheme('light')">☀️ <span data-t="th_light"></span></button>
        <button class="tg" data-th="dark" onclick="setTheme('dark')">🌙 <span data-t="th_dark"></span></button>
      </div>
    </div>
    <div class="card" data-pane="options" role="tabpanel" hidden>
      <h2 data-t="language"></h2>
      <select id="lang" style="max-width:200px" onchange="setLang(this.value)"></select>
    </div>
    <div class="card" data-pane="options" role="tabpanel" hidden>
      <h2 data-t="engine_update"></h2>
      <div id="engine"></div>
    </div>
    <div class="card" data-pane="options" role="tabpanel" hidden>
      <h2 data-t="server"></h2>
      <div class="row">
        <div><label data-t="public_url"></label><input id="puburl" data-tp="public_url_ph"></div>
        <div style="max-width:92px"><label data-t="max_conc"></label><input id="maxc" type="number" min="1" value="1"></div>
        <div style="max-width:200px"><label><span data-t="ctx_cap"></span> <span id="ctxtag" class="pill" style="font-size:10px;padding:1px 7px;margin-left:6px"></span></label><input id="ctxcap" type="number" min="1024" step="1024" value="8192" oninput="ctxTag()" data-tt="ctx_tip"></div>
        <div style="flex:0"><button onclick="saveCfg()" data-t="save"></button></div>
      </div>
    </div>
    <div class="card" data-pane="options" role="tabpanel" hidden>
      <h2 data-t="pricing"></h2>
      <label data-t="cost"></label>
      <div class="row"><div style="max-width:200px"><input id="costtok" type="number" min="0" step="0.01" data-tp="cost_ph" data-tt="cost_tip" onchange="saveCost()"></div></div>
      <div class="mut" style="font-size:12px;margin-top:6px" data-t="cost_note"></div>
    </div>
    <div class="card" data-pane="options" role="tabpanel" hidden>
      <h2 data-t="usage_data"></h2>
      <div class="mut" style="font-size:12px" data-t="usage_note"></div>
      <div class="sp"><button class="danger" onclick="wipeData()">🗑 <span data-t="usage_wipe"></span></button></div>
    </div>
    <div class="card" data-pane="options" role="tabpanel" hidden>
      <h2 data-t="user_keys"></h2>
      <div class="mut" style="font-size:12px" data-t="keys_file"></div>
      <div class="sp row" style="gap:6px">
        <button class="tg" onclick="keysOut()">⬇ <span data-t="export"></span></button>
        <button class="tg" onclick="$('#keysin').click()">⬆ <span data-t="import"></span></button>
        <input id="keysin" type="file" accept=".json,application/json" hidden onchange="keysIn(this)">
      </div>
    </div>
    <div class="card" data-pane="options" role="tabpanel" hidden>
      <h2 data-t="security"></h2>
      <label data-t="admin_token"></label>
      <div class="row"><div><input id="ntok" type="password" autocomplete="new-password" data-tp="token_ph"></div>
        <div style="flex:0"><button class="ghost" onclick="setTok(1)" data-tt="token_gen_tip" data-t="generate"></button></div>
        <div style="flex:0"><button onclick="setTok()" data-t="change"></button></div></div>
      <div id="ntokout" class="sp"></div>
    </div>
    <div class="card" data-pane="options" role="tabpanel" hidden>
      <h2 data-t="session"></h2>
      <div class="mut" style="font-size:12px" data-t="log_out_note"></div>
      <div class="sp"><button class="ghost" onclick="logout()" data-t="log_out"></button></div>
    </div>
      </div>
    </div>
  </div>
</div>
<style>
#drawer label,#drawer select{display:inline-flex;align-items:center;width:auto;margin:0 6px 0 0}#drawer input{width:auto;margin:0 5px 0 0}
.krow{display:flex;gap:6px}.krow input{flex:1;min-width:0}
#cloudp label{display:block;font-size:11px;color:#6b7280;margin-bottom:3px}
#cloudp input,#cloudp select{width:100%;box-sizing:border-box}
#cloudp input:disabled{background:#f2f4f9;color:#8a93a6}
.msec{font-weight:700;font-size:12px;letter-spacing:.3px;color:#44506b;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid #e6e9f0}
.msec:first-child{margin-top:4px}
.tabwrap{display:flex;gap:14px;align-items:flex-start}
.vtabs{display:flex;flex-direction:column;gap:2px;flex:0 0 158px;position:sticky;top:14px}
.vtab{display:flex;align-items:center;gap:8px;text-align:left;background:transparent;border:0;padding:9px 11px;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;color:#44506b}
.vtab .ti{font-size:15px;line-height:1}
.vtab[hidden]{display:none}
.mdl{padding:7px 0;border-bottom:1px solid var(--ln);margin:0}
.mdl .lbtn{flex:0 0 auto;width:38px;padding:6px 0;font-size:13px}
.hbtn{width:18px;height:18px;margin-left:6px;cursor:pointer;vertical-align:middle}
.lnk{display:inline-flex;align-items:center;gap:7px;height:40px;box-sizing:border-box;vertical-align:middle;padding:0 14px;margin:6px 8px 0 0;border-radius:10px;background:var(--in);border:1px solid var(--ln);color:var(--tx);text-decoration:none;font-size:13px}
.lnk:hover{border-color:var(--ac);box-shadow:0 2px 10px rgba(0,0,0,.12)}
#askm{white-space:pre-line}

  copy(L.join('\n'));
}
// navigator.clipboard needs a secure context; the LAN panel is plain HTTP, so execCommand is the fallback
function copy(t) {
  const ok = () => toast(__('copied'));
  if (window.isSecureContext && navigator.clipboard) {
    navigator.clipboard.writeText(t).then(ok).catch(() => copyFallback(t, ok));
    return;
  }
  copyFallback(t, ok);
}
function copyFallback(t, ok) {
  const ta = document.createElement('textarea');
  ta.value = t;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';   // off screen but focusable
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, t.length);               // iOS ignores select() alone
  let done = false;
  try { done = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  done ? ok() : toast(__('not_copied'));
}
async function testConn() {
  const out = $('#testout');
  if (!LANU) { out.innerHTML = '<span style="color:var(--dz)">' + __('no_net') + '</span>'; return; }
  out.textContent = __('testing', [LANU]);

    const h = await fetch(LANU + '/health', { cache: 'no-store' }).then(r => r.json()).catch(() => null);
    let models = null;
    if (h && h.ok && KEY0) { const m = await fetch(LANU + '/v1/models', { headers: { authorization: 'Bearer ' + KEY0 } }).then(r => r.json()).catch(() => null); if (m && m.data) models = m.data.length; }
    out.innerHTML = __('x_at', [h && h.ok ? `<span class="ok">${__('responds')}</span>` : `<span style="color:var(--dz)">${__('no_response')}</span>`, `<code>${LANU}</code>`])
      + (h && h.ok && models != null ? ' · ' + __('n_models', [`<b>${models}</b>`]) : '');

}
// theme: '' system · 'light' · 'dark' — lives in Settings; highlights the active choice and repaints the chart
function setTheme(m) { if (m) document.documentElement.setAttribute('data-theme', m); else document.documentElement.removeAttribute('data-theme'); try { localStorage.setItem('ia_theme', m); } catch (_) {} document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('play', (b.dataset.th || '') === m)); try { mnDraw(); } catch (_) {} }
// language: kept by the server (config.json lang); the reload brings the page its new bag
async function setLang(l) { const r = await api('/config', 'POST', { lang: l }).catch(() => null); if (r && r.lang === l) return location.reload(); $('#lang').value = I18N.lang; toast(__('not_saved')); }
(function () { let t = ''; try { t = localStorage.getItem('ia_theme') || ''; } catch (_) {} setTheme(t); put('#lang', (I18N.langs || []).map(l => `<option value="${l.code}"${l.code === I18N.lang ? ' selected' : ''}>${esc(l.name)}</option>`).join('')); const k = localStorage.getItem('ia_tok'); if (k) login(k); })();
